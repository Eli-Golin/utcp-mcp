<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="title desc">
  <title id="title">utcp-mcp bold</title>
  <desc id="desc">A suspension bridge: one anchor on the left, fanning out to many tools on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="200" rx="28" fill="url(#bg)"/>

  <!-- icon -->
  <g transform="translate(24 20)">
    <rect width="160" height="160" rx="34" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <g transform="translate(0 -16)">
    <circle cx="34" cy="108" r="26" fill="url(#glow)"/>
    <!-- hangers -->
    <g stroke="#475569" stroke-width="3" stroke-linecap="round">
      <line x1="56" y1="76" x2="56" y2="108"/>
      <line x1="80" y1="64" x2="80" y2="108"/>
      <line x1="104" y1="76" x2="104" y2="108"/>
    </g>
    <!-- deck -->
    <line x1="34" y1="108" x2="124" y2="108" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <!-- main cable -->
    <path d="M34 108 Q80 22 124 108" fill="none" stroke="url(#arc)" stroke-width="9" stroke-linecap="round"/>
    <!-- fan-out to tools -->
    <g stroke="#a78bfa" stroke-width="3.5" stroke-linecap="round">
      <line x1="124" y1="108" x2="142" y2="76"/>
      <line x1="124" y1="108" x2="146" y2="98"/>
      <line x1="124" y1="108" x2="146" y2="120"/>
      <line x1="124" y1="108" x2="142" y2="140"/>
    </g>
    <g fill="#e9d5ff">
      <circle cx="142" cy="76" r="5"/>
      <circle cx="146" cy="98" r="5"/>
      <circle cx="146" cy="120" r="5"/>
      <circle cx="142" cy="140" r="5"/>
    </g>
    <!-- the one MCP anchor -->
    <circle cx="34" cy="108" r="11" fill="#22d3ee"/>
    <circle cx="34" cy="108" r="4.5" fill="#0f172a"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="214" y="104" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">utcp<tspan fill="#22d3ee">·</tspan>mcp</text>
    <text x="216" y="142" font-size="20" fill="#94a3b8">one MCP server, every tool called natively</text>
    <g transform="translate(500 61)">
      <rect width="92" height="34" rx="17" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="46" y="23" font-size="18" font-weight="700" fill="#c4b5fd" text-anchor="middle" letter-spacing="1">bold</text>
    </g>
  </g>
</svg>
